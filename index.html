<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Facturas Gmail</title>
    
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librería para crear ZIPs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <!-- Google Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google API Scripts -->
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Transición suave para el panel de filtros */
        .filter-panel {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .filter-panel.open {
            max-height: 500px;
            opacity: 1;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Componente de Icono
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconName = name.replace(/([A-Z])/g, '-$1').toLowerCase(); // Camel to kebab
            return <i data-lucide={iconName} width={size} height={size} className={className}></i>;
        };

        function App() {
            // Estados de Configuración y Auth
            const CLIENT_ID_CONFIG = '81621005272-3g1kkuk30dvgsmjk44ug02001mk6usm1.apps.googleusercontent.com';
            
            const [tokenClient, setTokenClient] = useState(null);
            const [accessToken, setAccessToken] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [isGapiLoaded, setIsGapiLoaded] = useState(false);

            // Estados de Filtros Avanzados
            const [showFilters, setShowFilters] = useState(false);
            const [filters, setFilters] = useState({
                mainQuery: 'Factura', // Búsqueda general por defecto
                subject: '',          // Debe estar en asunto
                from: '',             // Remitente específico
                exclude: '',          // Palabras para EXCLUIR
                dateFrom: '',
                dateTo: ''
            });

            // Estados de la Aplicación
            const [emails, setEmails] = useState([]);
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState('');
            const [selectedEmails, setSelectedEmails] = useState({});
            const [initialLoadDone, setInitialLoadDone] = useState(false);

            // Inicializar Google API
            useEffect(() => {
                const initGapi = () => {
                    window.gapi.load('client', async () => {
                        await window.gapi.client.init({
                            discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/gmail/v1/rest'],
                        });
                        setIsGapiLoaded(true);
                    });
                };

                if (window.gapi) {
                    initGapi();
                }
                if (window.lucide) window.lucide.createIcons();
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [emails, loading, userProfile, showFilters]);

            // Configurar Cliente de Token (Auth)
            const initTokenClient = () => {
                const client = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID_CONFIG,
                    scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/userinfo.profile',
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            setAccessToken(tokenResponse.access_token);
                            fetchUserProfile(tokenResponse.access_token);
                        }
                    },
                });
                setTokenClient(client);
                client.requestAccessToken();
            };

            const fetchUserProfile = async (token) => {
                try {
                    const response = await fetch('https://www.googleapis.com/oauth2/v1/userinfo?alt=json', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const data = await response.json();
                    setUserProfile(data);
                } catch (error) {
                    console.error("Error fetching profile", error);
                }
            };

            // Manejador de cambios en los filtros
            const handleFilterChange = (field, value) => {
                setFilters(prev => ({
                    ...prev,
                    [field]: value
                }));
            };

            // Función Principal: Buscar Correos
            const searchEmails = useCallback(async (isAutoLoad = false) => {
                if (!accessToken) return;
                setLoading(true);
                setEmails([]);
                setSelectedEmails({});
                setStatusMsg(isAutoLoad ? 'Cargando historial...' : 'Aplicando filtros inteligentes...');

                try {
                    // --- CONSTRUCCIÓN DE LA QUERY DE GMAIL ---
                    // Documentación: https://support.google.com/mail/answer/7190
                    
                    let queryParts = ['has:attachment']; // Base: solo correos con adjuntos
                    
                    // 1. Palabra clave principal (ej: "Factura")
                    if (filters.mainQuery.trim()) {
                        queryParts.push(`"${filters.mainQuery.trim()}"`);
                    }
                    
                    // 2. Asunto específico
                    if (filters.subject.trim()) {
                        queryParts.push(`subject:(${filters.subject.trim()})`);
                    }
                    
                    // 3. Remitente específico
                    if (filters.from.trim()) {
                        queryParts.push(`from:(${filters.from.trim()})`);
                    }
                    
                    // 4. EXCLUSIONES (La parte clave: signo menos delante)
                    // Ej: -Publicidad -Newsletter
                    if (filters.exclude.trim()) {
                        const exclusions = filters.exclude.trim().split(' ').map(word => `-${word}`).join(' ');
                        queryParts.push(exclusions);
                    }

                    // 5. Fechas
                    if (filters.dateFrom) queryParts.push(`after:${filters.dateFrom.replaceAll('-', '/')}`);
                    if (filters.dateTo) queryParts.push(`before:${filters.dateTo.replaceAll('-', '/')}`);

                    const finalQuery = queryParts.join(' ');
                    console.log("Query enviada a Gmail:", finalQuery); // Para depuración

                    const response = await window.gapi.client.gmail.users.messages.list({
                        'userId': 'me',
                        'q': finalQuery,
                        'maxResults': 100
                    });

                    const messages = response.result.messages || [];
                    
                    if (messages.length === 0) {
                         setStatusMsg('No se encontraron correos que coincidan con estos filtros.');
                         setLoading(false);
                         return;
                    }

                    setStatusMsg(`Analizando ${messages.length} correos...`);

                    const processedEmails = [];

                    // Procesamiento de mensajes
                    for (const msg of messages) {
                        try {
                            const details = await window.gapi.client.gmail.users.messages.get({
                                'userId': 'me',
                                'id': msg.id
                            });

                            const payload = details.result.payload;
                            const headers = payload.headers;
                            
                            const subject = headers.find(h => h.name === 'Subject')?.value || '(Sin Asunto)';
                            const from = headers.find(h => h.name === 'From')?.value || 'Desconocido';
                            const dateHeader = headers.find(h => h.name === 'Date')?.value;
                            
                            const dateObj = new Date(dateHeader);
                            const dateStr = dateObj.toLocaleDateString('es-ES');

                            // Buscar adjuntos recursivamente
                            const attachments = [];
                            const findAttachments = (parts) => {
                                if (!parts) return;
                                parts.forEach(part => {
                                    if (part.filename && part.filename.length > 0 && part.body && part.body.attachmentId) {
                                        attachments.push({
                                            id: part.body.attachmentId,
                                            filename: part.filename,
                                            mimeType: part.mimeType,
                                            size: part.body.size,
                                            messageId: msg.id
                                        });
                                    }
                                    if (part.parts) findAttachments(part.parts);
                                });
                            };
                            
                            findAttachments(payload.parts);

                            if (attachments.length > 0) {
                                processedEmails.push({
                                    id: msg.id,
                                    threadId: msg.threadId,
                                    subject,
                                    from,
                                    date: dateStr,
                                    rawDate: dateObj, // Importante para ordenar antes de renombrar
                                    attachments
                                });
                            }
                        } catch (err) {
                            console.warn("Error mensaje individual", err);
                        }
                    }

                    setEmails(processedEmails);
                    setStatusMsg(`Encontrados ${processedEmails.length} correos válidos.`);

                } catch (error) {
                    console.error(error);
                    setStatusMsg('Error al buscar: ' + error.message);
                } finally {
                    setLoading(false);
                }
            }, [accessToken, filters]);

            // Efecto de carga inicial
            useEffect(() => {
                if (accessToken && !initialLoadDone) {
                    setInitialLoadDone(true);
                    searchEmails(true);
                }
            }, [accessToken, initialLoadDone, searchEmails]);

            // Descarga individual
            const downloadAttachment = async (messageId, attachmentId, filename) => {
                try {
                    const response = await window.gapi.client.gmail.users.messages.attachments.get({
                        'userId': 'me',
                        'messageId': messageId,
                        'id': attachmentId
                    });
                    const dataBase64Rep = response.result.data.replace(/-/g, '+').replace(/_/g, '/');
                    const content = atob(dataBase64Rep);
                    const byteNumbers = new Uint8Array(content.length);
                    for (let i = 0; i < content.length; i++) byteNumbers[i] = content.charCodeAt(i);
                    const blob = new Blob([byteNumbers], { type: "application/octet-stream" });
                    saveAs(blob, filename);
                } catch (error) {
                    alert('Error descarga: ' + error.message);
                }
            };

            const toggleSelectEmail = (id) => setSelectedEmails(p => ({ ...p, [id]: !p[id] }));
            
            const toggleSelectAll = () => {
                const all = Object.keys(selectedEmails).length === emails.length && emails.length > 0;
                setSelectedEmails(all ? {} : emails.reduce((acc, e) => ({...acc, [e.id]: true}), {}));
            };

            // --- LÓGICA DE RENOMBRADO INTELIGENTE (ZIP) ---
            const downloadSelectedAsZip = async () => {
                const idsToDownload = Object.keys(selectedEmails).filter(id => selectedEmails[id]);
                if (idsToDownload.length === 0) return;

                setLoading(true);
                setStatusMsg(`Procesando y renombrando ${idsToDownload.length} correos...`);
                
                const zip = new JSZip();
                
                // Mapa para llevar la cuenta: { "Endesa": 2, "Amazon": 5, "Flat": 1 }
                const senderCounters = {};

                try {
                    // 1. Ordenamos por fecha (del más antiguo al más nuevo) para que la numeración sea lógica
                    // "Flat1.pdf" será la factura de enero, "Flat2.pdf" la de febrero, etc.
                    const sortedEmails = emails
                        .filter(e => selectedEmails[e.id])
                        .sort((a, b) => a.rawDate - b.rawDate);

                    for (const email of sortedEmails) {
                        // Limpieza del nombre del remitente
                        // De: "Google Cloud <noreply@google.com>" -> "GoogleCloud"
                        // De: "Flat.io Payments" -> "FlatioPayments"
                        let cleanSender = email.from.split('<')[0].trim();
                        cleanSender = cleanSender.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ]/g, ''); // Solo letras y números
                        
                        if (cleanSender.length === 0) cleanSender = "RemitenteDesconocido";

                        // Si es la primera vez que vemos este remitente, inicializamos a 0
                        if (!senderCounters[cleanSender]) senderCounters[cleanSender] = 0;
                        
                        for (const att of email.attachments) {
                            senderCounters[cleanSender]++; // Incrementamos contador
                            const counter = senderCounters[cleanSender];

                            const response = await window.gapi.client.gmail.users.messages.attachments.get({
                                'userId': 'me',
                                'messageId': email.id,
                                'id': att.id
                            });

                            // Obtener extensión original del archivo (pdf, jpg, zip...)
                            const extension = att.filename.split('.').pop();
                            
                            // NUEVO NOMBRE DE ARCHIVO: Remitente + Numero + .Extension
                            // Ejemplo: Flat1.pdf
                            const newFilename = `${cleanSender}${counter}.${extension}`;

                            const dataBase64Rep = response.result.data.replace(/-/g, '+').replace(/_/g, '/');
                            
                            // Añadimos al ZIP con el nuevo nombre
                            zip.file(newFilename, dataBase64Rep, {base64: true});
                        }
                    }

                    setStatusMsg("Comprimiendo archivos...");
                    const content = await zip.generateAsync({type:"blob"});
                    saveAs(content, `facturas_renombradas_${new Date().toISOString().slice(0,10)}.zip`);
                    setStatusMsg("Descarga completada.");

                } catch (error) {
                    setStatusMsg("Error en ZIP: " + error.message);
                } finally {
                    setLoading(false);
                }
            };

            if (!accessToken) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
                            <div className="flex justify-center mb-6 bg-blue-100 w-20 h-20 rounded-full items-center mx-auto text-blue-600">
                                <Icon name="FileText" size={40} />
                            </div>
                            <h1 className="text-2xl font-bold text-gray-800 mb-2">Mis Facturas</h1>
                            <p className="text-gray-500 mb-8 text-sm">Gestiona y descarga tus facturas de Gmail.</p>
                            <button 
                                onClick={initTokenClient}
                                disabled={!isGapiLoaded}
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-xl font-medium transition shadow-md hover:shadow-lg disabled:opacity-50 flex items-center justify-center gap-3"
                            >
                                <Icon name="LogIn" size={20} />
                                Iniciar Sesión con Google
                            </button>
                            <p className="mt-4 text-xs text-gray-400">Versión segura v2.0</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-100 p-2 rounded-lg text-blue-600">
                                <Icon name="FileText" size={24} />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-gray-800">Mis Facturas</h1>
                                <p className="text-xs text-gray-500 font-medium">
                                    {userProfile && userProfile.name ? `Hola, ${userProfile.name}` : 'Hola, Usuario'}
                                </p>
                            </div>
                        </div>
                        <button 
                            onClick={() => window.location.reload()}
                            className="text-gray-500 hover:text-red-600 text-sm font-medium px-3 py-1 rounded hover:bg-red-50 transition"
                        >
                            Cerrar Sesión
                        </button>
                    </div>

                    {/* Controles de Búsqueda y Panel de Filtros */}
                    <div className="bg-white p-6 rounded-lg shadow-sm mb-6 border border-gray-100">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4">
                            <h2 className="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2 md:mb-0">
                                Configuración de Búsqueda
                            </h2>
                            <button 
                                onClick={() => setShowFilters(!showFilters)}
                                className={`text-sm flex items-center gap-2 px-3 py-1.5 rounded-full transition border ${showFilters ? 'bg-blue-50 border-blue-200 text-blue-600' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'}`}
                            >
                                <Icon name="SlidersHorizontal" size={14} />
                                {showFilters ? 'Ocultar Filtros' : 'Configuración Avanzada'}
                            </button>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Desde</label>
                                <input 
                                    type="date" 
                                    value={filters.dateFrom} 
                                    onChange={(e) => handleFilterChange('dateFrom', e.target.value)}
                                    className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Hasta</label>
                                <input 
                                    type="date" 
                                    value={filters.dateTo} 
                                    onChange={(e) => handleFilterChange('dateTo', e.target.value)}
                                    className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500"
                                />
                            </div>
                            <div className="md:col-span-2">
                                <button 
                                    onClick={() => searchEmails(false)}
                                    disabled={loading}
                                    className="w-full bg-blue-600 text-white py-2.5 px-4 rounded-lg hover:bg-blue-700 transition flex justify-center items-center gap-2 font-medium"
                                >
                                    {loading ? <div className="loader"></div> : <Icon name="Search" size={18} />}
                                    {loading ? 'Procesando...' : 'Buscar con Filtros'}
                                </button>
                            </div>
                        </div>

                        {/* PANEL DE FILTROS AVANZADOS (Desplegable) */}
                        <div className={`filter-panel ${showFilters ? 'open' : ''}`}>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Contiene las palabras</label>
                                    <input 
                                        type="text" 
                                        value={filters.mainQuery}
                                        onChange={(e) => handleFilterChange('mainQuery', e.target.value)}
                                        placeholder="Ej: Factura, Recibo, Invoice"
                                        className="w-full p-2 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none"
                                    />
                                    <p className="text-xs text-gray-400 mt-1">Busca en asunto y cuerpo.</p>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-red-500 uppercase mb-1">Excluir palabras (NO contiene)</label>
                                    <input 
                                        type="text" 
                                        value={filters.exclude}
                                        onChange={(e) => handleFilterChange('exclude', e.target.value)}
                                        placeholder="Ej: Publicidad Presupuesto Spam"
                                        className="w-full p-2 text-sm border border-red-200 rounded focus:ring-1 focus:ring-red-500 outline-none bg-red-50"
                                    />
                                    <p className="text-xs text-gray-400 mt-1">Útil para quitar correos no deseados.</p>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Remitente (De:)</label>
                                    <input 
                                        type="text" 
                                        value={filters.from}
                                        onChange={(e) => handleFilterChange('from', e.target.value)}
                                        placeholder="Ej: amazon, endesa, paypal"
                                        className="w-full p-2 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Asunto contiene</label>
                                    <input 
                                        type="text" 
                                        value={filters.subject}
                                        onChange={(e) => handleFilterChange('subject', e.target.value)}
                                        placeholder="Ej: NumPedido, Order"
                                        className="w-full p-2 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                            </div>
                        </div>

                        {statusMsg && (
                            <div className={`mt-4 p-3 rounded-lg text-sm flex items-center gap-2 ${statusMsg.includes('Error') ? 'bg-red-50 text-red-700' : 'bg-blue-50 text-blue-700'}`}>
                                <Icon name={statusMsg.includes('Error') ? "AlertCircle" : "Info"} size={18} />
                                {statusMsg}
                            </div>
                        )}
                    </div>

                    {/* Lista de Resultados */}
                    {emails.length > 0 && (
                        <div className="bg-white rounded-lg shadow-sm overflow-hidden border border-gray-100">
                            <div className="p-4 border-b border-gray-100 flex flex-wrap justify-between items-center bg-gray-50 gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded border border-gray-200 cursor-pointer hover:bg-gray-50" onClick={toggleSelectAll}>
                                        <input 
                                            type="checkbox" 
                                            checked={Object.keys(selectedEmails).length === emails.length}
                                            readOnly
                                            className="w-4 h-4 text-blue-600 rounded cursor-pointer"
                                        />
                                        <span className="text-sm font-medium text-gray-700 select-none">Todos</span>
                                    </div>
                                    <span className="text-xs text-gray-500 hidden sm:inline">
                                        {Object.values(selectedEmails).filter(Boolean).length} seleccionados
                                    </span>
                                </div>
                                <button 
                                    onClick={downloadSelectedAsZip}
                                    disabled={loading || Object.values(selectedEmails).filter(Boolean).length === 0}
                                    className="bg-green-600 text-white text-sm py-2 px-4 rounded-lg hover:bg-green-700 transition flex items-center gap-2 disabled:opacity-50 font-medium"
                                >
                                    <Icon name="Archive" size={16} />
                                    Descargar ZIP Renombrado
                                </button>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead className="bg-white text-gray-500 text-xs font-semibold uppercase tracking-wider border-b border-gray-100">
                                        <tr>
                                            <th className="p-4 w-10 text-center">#</th>
                                            <th className="p-4">Fecha</th>
                                            <th className="p-4">Remitente</th>
                                            <th className="p-4">Asunto</th>
                                            <th className="p-4">Facturas</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-50">
                                        {emails.map(email => (
                                            <tr key={email.id} className={`hover:bg-blue-50/50 transition ${selectedEmails[email.id] ? 'bg-blue-50/30' : ''}`}>
                                                <td className="p-4 text-center">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={!!selectedEmails[email.id]}
                                                        onChange={() => toggleSelectEmail(email.id)}
                                                        className="w-4 h-4 text-blue-600 rounded cursor-pointer"
                                                    />
                                                </td>
                                                <td className="p-4 text-sm text-gray-600 whitespace-nowrap font-medium">{email.date}</td>
                                                <td className="p-4 text-sm text-gray-800">
                                                    {email.from.replace(/<.*>/, '')}
                                                </td>
                                                <td className="p-4 text-sm text-gray-600 max-w-xs truncate" title={email.subject}>
                                                    {email.subject}
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex flex-wrap gap-2">
                                                        {email.attachments.map((att, idx) => (
                                                            <button 
                                                                key={idx}
                                                                onClick={() => downloadAttachment(email.id, att.id, att.filename)}
                                                                className="flex items-center gap-2 text-xs bg-white hover:bg-blue-600 hover:text-white text-gray-700 py-1.5 px-3 rounded-full border border-gray-200 hover:border-blue-600 transition shadow-sm group"
                                                            >
                                                                <Icon name="File" size={12} className="text-gray-400 group-hover:text-white" />
                                                                <span className="truncate max-w-[120px]">{att.filename}</span>
                                                                <Icon name="Download" size={12} className="opacity-0 group-hover:opacity-100" />
                                                            </button>
                                                        ))}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    
                    {emails.length === 0 && !loading && accessToken && (
                        <div className="text-center py-20">
                            <div className="bg-gray-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
                                <Icon name="Inbox" size={32} className="text-gray-400" />
                            </div>
                            <h3 className="text-gray-900 font-medium mb-1">Sin facturas recientes</h3>
                            <p className="text-gray-500 text-sm">Prueba ampliando el rango de fechas o modificando los filtros.</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
